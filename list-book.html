

<!DOCTYPE html>
<html>
<head>
    <title>List a Book - Campus Book Exchange</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
        }

        nav {
            background-color: navy;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        form {
            background-color: white;
            width: 300px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid black;
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Campus Book Exchange</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="books.html">Browse Books</a>
        <a href="list-book.html">List a Book</a>
    </nav>

    <h2 id="formHeading">List Your Book</h2>

    <button onclick="changeSize()">Change Heading Size</button>

    <button onclick="toggleForm()">Show/Hide Form</button>

    <form id="bookForm">

        <label>Student Name:</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label>Book Title:</label>
        <input type="text" id="bookTitle" placeholder="Enter book title">

        <label>Author:</label>
        <input type="text" id="author" placeholder="Enter author name">

        <label>Subject/Category:</label>
        <input type="text" id="category" placeholder="Enter category">

        <label>Book Condition:</label>

        <select id="condition">
            <option value="">Select condition</option>
            <option value="Excellent">Excellent</option>
            <option value="Very Good">Very Good</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
        </select>

        <br>

        <button type="button" onclick="submitBook()">
            Submit
        </button>

    </form>

    <h3 id="message"></h3>

    <script>
        function submitBook() {
            let name = document.getElementById("studentName").value;
            let title = document.getElementById("bookTitle").value;
            let author = document.getElementById("author").value;
            let category = document.getElementById("category").value;
            let condition = document.getElementById("condition").value;

            if (name == "" || title == "" || author == "" ||
                category == "" || condition == "") {

                document.getElementById("message").textContent =
                    "Error: Please fill in all the fields.";

            } else {

                document.getElementById("message").textContent =
                    "Thank you, " + name + "! Your book '" +
                    title + "' has been listed successfully.";
            }
        }

        function changeSize() {
            document.getElementById("formHeading").style.fontSize =
                "40px";
        }

        function toggleForm() {
            let form = document.getElementById("bookForm");

            if (form.style.display == "none") {
                form.style.display = "block";
            } else {
                form.style.display = "none";
            }
        }
    </script>

</body>
</html>
